pluginManagement {
    repositories {
        // ModBench is currently consumed from the sibling project's local development publication.
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'YuushyaModellingEnhancedEditor'
