pluginManagement {
    repositories {
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.zhongbai2333.BenchMod'
            }
        }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    plugins {
        id 'com.zhongbai233.minecraft-bench' version providers.gradleProperty('modbench_version').get()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.zhongbai233.minecraft-bench') {
                useModule("com.github.zhongbai2333.BenchMod:bench-gradle-plugin:${requested.version}")
            }
        }
    }
}

plugins {
    // The daemon JVM criteria lets wrapper, IDE and CI clients launch this build with Java 25.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'YuushyaModellingEnhancedEditor'
