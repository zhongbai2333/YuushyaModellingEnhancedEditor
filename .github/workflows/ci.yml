name: Build & Release

on:
  push:
    # Pull requests already verify dev changes. Only rebuild after they land on
    # the default branch, avoiding duplicate push + pull_request runs.
    branches: ["master"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "libs/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - "src/**"
      - "libs/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and bundle mod Jar
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out enhanced editor
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure project Gradle wrapper is executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            mod_version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "${mod_id}" || -z "${mod_version}" || -z "${minecraft_version}" ]]; then
            echo "Required build metadata is missing from gradle.properties" >&2
            exit 1
          fi

          artifact_name="${mod_id}-${mod_version}+mc${minecraft_version}-neoforge.jar"
          echo "mod_version=${mod_version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Verify IDE model
        shell: bash
        run: ./gradlew eclipseClasspath verifyIdeClasspath --no-daemon --stacktrace

      - name: Build and verify clean production Jar
        shell: bash
        run: >-
          ./gradlew releaseBuild
          -Pmod_version="${{ steps.meta.outputs.mod_version }}"
          --no-build-cache
          --no-configuration-cache
          --no-daemon
          --stacktrace

      - name: Bundle Jar and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build.nosync/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one production Jar under build.nosync/libs, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi

          cp "${jars[0]}" "dist/${{ steps.meta.outputs.artifact_name }}"
          (
            cd dist
            sha256sum "${{ steps.meta.outputs.artifact_name }}" \
              > "${{ steps.meta.outputs.artifact_name }}.sha256"
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            build.nosync/reports/
            build.nosync/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-bench:
    name: Verify release in integrated client
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out enhanced editor
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless OpenGL runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64

      - name: Ensure project Gradle wrapper is executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Run integrated client acceptance
        shell: bash
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          ./gradlew verifyYuushyaEditorBench
          --no-daemon
          --stacktrace

      - name: Upload Bench report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bench-report
          path: |
            build.nosync/modBench/raw-results/default/client/
            build.nosync/modBench/bundles/default/client/
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: release-bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-build
          path: release-artifacts

      - name: Verify downloaded artifact set
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-artifacts
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 1
          (
            cd release-artifacts
            sha256sum --check ./*.sha256
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Yuushya Modelling Enhanced Editor ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            release-artifacts/*.jar
            release-artifacts/*.sha256
