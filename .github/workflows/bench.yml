name: Integrated Client Bench

on:
  push:
    branches: ["master"]
    paths:
      - "src/main/**"
      - "src/bench/**"
      - "libs/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "23 18 * * 6"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIBGL_ALWAYS_SOFTWARE: "1"

permissions:
  contents: read

concurrency:
  group: integrated-client-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Minecraft + NeoForge + Yuushya acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out enhanced editor
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless OpenGL runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64

      - name: Ensure project Gradle wrapper is executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Run integrated client acceptance
        shell: bash
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          ./gradlew verifyYuushyaEditorBench
          --no-daemon
          --stacktrace

      - name: Upload Bench report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-client-bench-report
          path: |
            build.nosync/modBench/raw-results/default/client/
            build.nosync/modBench/bundles/default/client/
          if-no-files-found: warn
          retention-days: 14
